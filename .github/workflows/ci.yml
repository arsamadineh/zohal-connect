name: Zohal CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check
        working-directory: engine

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: engine

      - name: Run Engine Tests
        run: cargo test --all
        working-directory: engine

      - name: Run Property Tests (10k toggles)
        run: cargo test -p zohal-engine --test torture_test -- --nocapture
        working-directory: engine

  app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: app

      - name: Format Check
        run: dart format --set-exit-if-changed .
        working-directory: app

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        working-directory: app

      - name: Run Unit & Widget Tests
        run: flutter test
        working-directory: app

  app-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Fetch Aether Android binaries
        run: |
          bash tools/fetch-aether.sh android-arm64
          bash tools/fetch-aether.sh android-armeabi-v7a
          bash tools/fetch-aether.sh android-x86_64

      - name: Install Dependencies
        run: flutter pub get
        working-directory: app

      - name: Build Android APK
        run: flutter build apk --split-per-abi --debug --android-skip-build-dependency-validation
        working-directory: app

  appimage-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Aether Linux binary
        run: bash tools/fetch-aether.sh linux-x86_64

      - name: Install Dependencies
        run: flutter pub get
        working-directory: app

      - name: Build Flutter Linux bundle
        run: flutter build linux --release
        working-directory: app

      - name: Build zohald
        run: cargo build --release -p zohald
        working-directory: engine

      - name: Build AppImage
        run: bash tools/build-appimage.sh "0.0.0-ci"

      - name: Smoke test AppImage (version + help surface)
        run: |
          chmod +x dist/linux/Zohal-0.0.0-ci-x86_64.AppImage
          ./dist/linux/Zohal-0.0.0-ci-x86_64.AppImage --appimage-extract \
            zohal.desktop usr/bin/zohal usr/bin/zohald usr/bin/aether \
            > /dev/null
          ls squashfs-root/usr/bin/

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-ci
          path: dist/linux/*.AppImage
