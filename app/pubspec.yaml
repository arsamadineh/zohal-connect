name: zohal
description: "قندشکن زحل - Zohal Connect"
publish_to: "none"
version: 0.1.14+14

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_rust_bridge: ^2.0.0
  window_manager: ^0.3.9
  tray_manager: ^0.2.3
  dynamic_color: ^1.7.0
  path_provider: ^2.1.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  intl: ^0.20.3
  country_flags: ^2.0.0
  shared_preferences: ^2.2.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Variable.ttf
