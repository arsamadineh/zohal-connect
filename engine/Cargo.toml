[workspace]
resolver = "2"
members = [
    "crates/zohal-proto",
    "crates/zohal-engine",
    "crates/zohal-platform",
    "crates/zohal-tun",
    "crates/zohald",
    "crates/zohal-bridge",
    "crates/zohal-android",
]

[workspace.package]
version = "0.1.8"
edition = "2021"
authors = ["Zohal Connect Team <dev@zohal.app>"]
license = "AGPL-3.0-only"

[workspace.dependencies]
zohal-proto = { path = "crates/zohal-proto" }
zohal-engine = { path = "crates/zohal-engine" }
zohal-platform = { path = "crates/zohal-platform" }
zohal-tun = { path = "crates/zohal-tun" }

tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
interprocess = { version = "2.4", features = ["tokio"] }
tun2proxy = { version = "0.8.4", default-features = false }
parking_lot = "0.12"
sha2 = "0.10"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }
sd-notify = "0.5.0"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
proptest = "1.6"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
